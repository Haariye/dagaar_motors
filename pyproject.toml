[project]
name = "dagaar_motors"
authors = [
    { name = "Dagaar Technology", email = "support@dagaar.com" }
]
description = "Enterprise vehicle rental, fleet, maintenance, and vehicle sales management for ERPNext"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"